<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @keyframes rotateReel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseDT {
      0%, 100% {
        opacity: 0.9;
        filter: drop-shadow(0 0 1px rgba(255, 123, 0, 0.7));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 3px rgba(255, 123, 0, 0.95)) drop-shadow(0 0 5px rgba(255, 123, 0, 0.5));
      }
    }
    .bg-reel {
      transform-origin: 16px 16px;
      animation: rotateReel 12s linear infinite;
      opacity: 0.4;
    }
    .fg-dt {
      animation: pulseDT 3s ease-in-out infinite;
    }
    .film-loop {
      stroke-dasharray: 2 2;
      animation: rotateReel 24s linear infinite;
    }
  </style>

  <!-- Outer dashed film boundary (rotates counter-clockwise) -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#ff7b00" stroke-width="0.75" class="film-loop" style="animation-direction: reverse;" />

  <!-- Background Rotating Cinematic Film Reel -->
  <g class="bg-reel">
    <!-- Reel Outer Rim -->
    <circle cx="16" cy="16" r="12" fill="none" stroke="#ff7b00" stroke-width="1" />
    <!-- Reel Central Spindle Core -->
    <circle cx="16" cy="16" r="3.5" fill="none" stroke="#ff7b00" stroke-width="0.75" />
    <!-- Spindle Spokes / Cutouts -->
    <line x1="16" y1="4" x2="16" y2="28" stroke="#ff7b00" stroke-width="0.75" />
    <line x1="4" y1="16" x2="28" y2="16" stroke="#ff7b00" stroke-width="0.75" />
    <line x1="7.51" y1="7.51" x2="24.49" y2="24.49" stroke="#ff7b00" stroke-width="0.75" />
    <line x1="7.51" y1="24.49" x2="24.49" y2="7.51" stroke="#ff7b00" stroke-width="0.75" />
  </g>

  <!-- Solid Backing for DT Monogram Legibility -->
  <circle cx="16" cy="16" r="9.5" fill="#050505" opacity="0.9" />

  <!-- Foreground Pulsing DT Monogram -->
  <g class="fg-dt" fill="none" stroke="#ff7b00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter 'D' -->
    <path d="M 9.5,11 L 9.5,21 M 9.5,11 C 13.5,11 15,13 15,16 C 15,19 13.5,21 9.5,21" />
    <!-- Letter 'T' -->
    <path d="M 17.25,11 L 23.25,11 M 20.25,11 L 20.25,21" />
  </g>
</svg>
